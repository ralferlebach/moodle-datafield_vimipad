##############################################################################
# GitHub Actions Release CI - datafield_vimipad
#
# Triggered on push / PR to main. Provides the "CI complete" status check for
# branch protection. Mirrors mod_vimipad's release CI, adapted for a satellite:
# mod_vimipad is checked out as an extra plugin. No bundle/JS jobs.
#
# Matrix: Moodle 4.5 / 5.0 / 5.2  x  PHP 8.1-8.3  x  mariadb / pgsql
##############################################################################

name: Moodle Plugin Release CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

env:
  MOODLE_CI: '^4'
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_AUDIT: 1
  PGPASSWORD: moodle
  VIMIPAD_REPO: ralferlebach/moodle-mod_vimipad
  VIMIPAD_REF: development

jobs:

  ci:
    name: "CI / ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle-branch: MOODLE_405_STABLE, php: '8.1', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.2', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   } }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.3', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
          - { moodle-branch: MOODLE_500_STABLE, php: '8.2', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
          - { moodle-branch: MOODLE_500_STABLE, php: '8.3', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   } }
          - { moodle-branch: MOODLE_502_STABLE, php: '8.3', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout mod_vimipad (dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VIMIPAD_REPO }}
          ref: ${{ env.VIMIPAD_REF }}
          path: deps/moodle-mod_vimipad

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, gd, intl, xmlrpc, soap, mbstring, pdo_mysql, pdo_pgsql
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install Moodle, plugin and dependency
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --extra-plugins ./deps \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name moodle
        env:
          DB:            ${{ matrix.db.type }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector
        run: moodle-plugin-ci phpcpd || true

      - name: Moodle Code Checker (PHPCS)
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin structure
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        run: moodle-plugin-ci mustache

      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@datafield_vimipad&&~@broken" \
            --start-servers

  # 1b. JS / AMD / Structure Lint (ESLint + AMD build + reproducibility gate).
  lint-js:
    name: "JS / AMD / Structure Lint"
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout mod_vimipad (dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VIMIPAD_REPO }}
          ref: ${{ env.VIMIPAD_REF }}
          path: deps/moodle-mod_vimipad

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle 4.5 baseline, plugin and dependency (no test init)
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --extra-plugins ./deps \
            --branch MOODLE_405_STABLE \
            --db-type mariadb \
            --db-host 127.0.0.1 --db-port 3306 \
            --db-user root --db-pass root --db-name moodle \
            --no-init
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Install Node dependencies (Moodle)
        run: npm install
        working-directory: ${{ github.workspace }}/moodle

      # Snapshot the committed AMD build, then rebuild it from amd/src and require
      # a byte-identical result. Grunt's "amd" task runs ESLint on the sources
      # (--max-lint-warnings=0). We call "npx grunt amd --files" directly rather
      # than "moodle-plugin-ci grunt", which deletes amd/build first.
      - name: Snapshot committed AMD build
        run: |
          mkdir -p /tmp/amdref
          cp moodle/mod/data/field/vimipad/amd/build/field.min.js     /tmp/amdref/
          cp moodle/mod/data/field/vimipad/amd/build/field.min.js.map /tmp/amdref/

      - name: Grunt - AMD module (ESLint + build)
        working-directory: ${{ github.workspace }}/moodle/mod/data/field/vimipad/amd
        run: |
          npx grunt amd \
            --files=mod/data/field/vimipad/amd/src/field.js \
            --max-lint-warnings=0

      - name: Verify committed AMD build matches the rebuild
        run: |
          diff /tmp/amdref/field.min.js     moodle/mod/data/field/vimipad/amd/build/field.min.js
          diff /tmp/amdref/field.min.js.map moodle/mod/data/field/vimipad/amd/build/field.min.js.map

      - name: PHPDoc check
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Mustache lint
        run: moodle-plugin-ci mustache

      - name: Validate plugin structure
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints

  ci-complete:
    name: CI complete
    needs: [ci, lint-js]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: All matrix jobs must have succeeded
        run: |
          if [[ "${{ needs.ci.result }}" == "success" && "${{ needs.lint-js.result }}" == "success" ]]; then
            echo "All CI jobs passed."
          else
            echo "ci=${{ needs.ci.result }} lint-js=${{ needs.lint-js.result }} - a job failed or was cancelled."
            exit 1
          fi
